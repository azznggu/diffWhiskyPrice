name: Test Scrape
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: node scripts/update-changi-prices.mjs
      - run: node scripts/update-japan-prices.mjs
      - name: Show data diff
        run: git diff data/whiskies.json | head -200
